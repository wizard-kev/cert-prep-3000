# NVIDIA GPU override for the ollama service. Enabled by the installer on machines with an
# NVIDIA card (COMPOSE_FILE=docker-compose.yml;docker-compose.gpu.yml in .env).
# Docker Desktop passes the GPU through WSL2; a current NVIDIA Windows driver is required.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
